[project]
name = "gt-trainer"
version = "0.1.0"
description = "Guitar timing and pitch practice desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyqtgraph>=0.13.7",
    "pyside6>=6.7",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["cx-freeze>=8.5.3"]

[project.scripts]
gt-trainer = "gt_trainer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gt_trainer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

